<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes da Ocorrência - Sistema de Ocorrências</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <h1>📋 Sistema de Ocorrências</h1>
      <div class="header-actions">
        <div class="user-info">
          <span id="userName">Usuário</span>
          <span id="userRole" class="user-badge">USER</span>
        </div>
        <button class="btn btn-danger btn-sm" onclick="logout()">Sair</button>
      </div>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-content">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="ocorrencias.html" class="nav-link">Ocorrências</a>
      <a href="nova-ocorrencia.html" class="nav-link">Nova Ocorrência</a>
      <a href="admin.html" class="nav-link" id="adminLink" style="display: none;">Administração</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <!-- Modo Visualização -->
    <div id="modoVisualizacao" style="display: none;">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Detalhes da Ocorrência</h2>
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary btn-sm" onclick="habilitarEdicao()" id="btnEditar">Editar</button>
            <button class="btn btn-danger btn-sm" onclick="excluirOcorrencia()" id="btnExcluir" style="display: none;">Excluir</button>
            <a href="ocorrencias.html" class="btn btn-secondary btn-sm">Voltar</a>
          </div>
        </div>

        <div style="display: grid; gap: 20px;">
          <div class="grid grid-2">
            <div>
              <label style="font-weight: 600; color: #64748b; display: block; margin-bottom: 5px;">Título</label>
              <p id="viewTitulo" style="font-size: 16px;">-</p>
            </div>
            <div>
              <label style="font-weight: 600; color: #64748b; display: block; margin-bottom: 5px;">Localização</label>
              <p id="viewLocalizacao" style="font-size: 16px;">-</p>
            </div>
          </div>

          <div>
            <label style="font-weight: 600; color: #64748b; display: block; margin-bottom: 5px;">Descrição</label>
            <p id="viewDescricao" style="font-size: 16px; white-space: pre-wrap;">-</p>
          </div>

          <div class="grid grid-3">
            <div>
              <label style="font-weight: 600; color: #64748b; display: block; margin-bottom: 5px;">Status</label>
              <span id="viewStatus" class="badge">-</span>
            </div>
            <div>
              <label style="font-weight: 600; color: #64748b; display: block; margin-bottom: 5px;">Prioridade</label>
              <span id="viewPrioridade" class="badge">-</span>
            </div>
            <div>
              <label style="font-weight: 600; color: #64748b; display: block; margin-bottom: 5px;">Categoria</label>
              <p id="viewCategoria" style="font-size: 16px;">-</p>
            </div>
          </div>

          <div class="grid grid-2">
            <div>
              <label style="font-weight: 600; color: #64748b; display: block; margin-bottom: 5px;">Empresa</label>
              <p id="viewEmpresa" style="font-size: 16px;">-</p>
            </div>
            <div>
              <label style="font-weight: 600; color: #64748b; display: block; margin-bottom: 5px;">Setor</label>
              <p id="viewSetor" style="font-size: 16px;">-</p>
            </div>
          </div>

          <div>
            <label style="font-weight: 600; color: #64748b; display: block; margin-bottom: 5px;">Denunciante</label>
            <p id="viewDenunciante" style="font-size: 16px;">-</p>
          </div>

          <div>
            <label style="font-weight: 600; color: #64748b; display: block; margin-bottom: 5px;">Anexos</label>
            <div id="viewArquivos" style="display: flex; flex-wrap: wrap; gap: 10px;">-</div>
          </div>

          <div class="grid grid-2">
            <div>
              <label style="font-weight: 600; color: #64748b; display: block; margin-bottom: 5px;">Cadastrado por</label>
              <p id="viewUsuario" style="font-size: 16px;">-</p>
            </div>
            <div>
              <label style="font-weight: 600; color: #64748b; display: block; margin-bottom: 5px;">Data de Cadastro</label>
              <p id="viewDataCriacao" style="font-size: 16px;">-</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modo Edição -->
    <div id="modoEdicao" style="display: none;">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Editar Ocorrência</h2>
        </div>

        <form id="formEdicao">
          <div class="grid grid-2">
            <div class="form-group">
              <label class="form-label">Título (Opcional)</label>
              <input type="text" id="editTitulo" class="form-input">
            </div>

            <div class="form-group">
              <label class="form-label">Localização <span style="color: red;">*</span></label>
              <input type="text" id="editLocalizacao" class="form-input" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Descrição (Opcional)</label>
            <textarea id="editDescricao" class="form-textarea"></textarea>
          </div>

          <div class="grid grid-3">
            <div class="form-group">
                <label class="form-label">Status <span style="color: red;">*</span></label>
                <select id="editStatus" class="form-select" required>
                    <option value="em andamento">Em Andamento</option>
                    <option value="resolvida">Resolvida</option>
                </select>
            </div>

            <div class="form-group">
              <label class="form-label">Prioridade <span style="color: red;">*</span></label>
              <select id="editPrioridade" class="form-select" required>
                <option value="baixa">Baixa</option>
                <option value="média">Média</option>
                <option value="alta">Alta</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Categoria <span style="color: red;">*</span></label>
              <select id="editCategoria" class="form-select" required></select>
            </div>
          </div>

          <div class="grid grid-2">
            <div class="form-group">
              <label class="form-label">Empresa <span style="color: red;">*</span></label>
              <select id="editEmpresa" class="form-select" required></select>
            </div>

            <div class="form-group">
              <label class="form-label">Setor <span style="color: red;">*</span></label>
              <select id="editSetor" class="form-select" required></select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Denunciante <span style="color: red;">*</span></label>
            <input type="text" id="editDenunciante" class="form-input" required>
          </div>

          <div style="display: flex; gap: 15px; justify-content: flex-end; margin-top: 30px;">
            <button type="button" class="btn btn-secondary" onclick="cancelarEdicao()">Cancelar</button>
            <button type="submit" class="btn btn-primary">
              <span id="btnSalvarText">Salvar Alterações</span>
              <span id="btnSalvarLoading" class="loading" style="display: none;"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    let currentUser = null;
    let ocorrencia = null;
    const urlParams = new URLSearchParams(window.location.search);
    const ocorrenciaId = urlParams.get('id');

    // Inicializar
    window.addEventListener('DOMContentLoaded', async () => {
      if (!ocorrenciaId) {
        alert('Ocorrência não encontrada');
        window.location.href = 'ocorrencias.html';
        return;
      }

      currentUser = await checkAuth();
      if (!currentUser) return;

      document.getElementById('userName').textContent = currentUser.nome;
      document.getElementById('userRole').textContent = currentUser.role.toUpperCase();
      
      if (isAdmin(currentUser)) {
        document.getElementById('adminLink').style.display = 'block';
      }

      await carregarOcorrencia();
    });

    // Carregar ocorrência
    async function carregarOcorrencia() {
      const { data, error } = await supabase
        .from('occurrences')
        .select(`
            *,
            empresas(id, nome),
            setores(id, nome),
            categorias(id, nome),
            users(nome)
        `)
        .eq('id', ocorrenciaId)
        .single();

      if (error || !data) {
        console.error('Erro ao carregar ocorrência:', error);
        alert('Ocorrência não encontrada');
        window.location.href = 'ocorrencias.html';
        return;
      }

      ocorrencia = data;
      renderizarVisualizacao();

      // Verificar permissões de edição
      const podeEditar = isAdmin(currentUser) || ocorrencia.user_id === currentUser.id;
      const podeExcluir = isAdmin(currentUser);

      document.getElementById('btnEditar').style.display = podeEditar ? 'inline-flex' : 'none';
      document.getElementById('btnExcluir').style.display = podeExcluir ? 'inline-flex' : 'none';
    }

    // Renderizar visualização
    function renderizarVisualizacao() {
        document.getElementById('viewTitulo').textContent = `#${ocorrencia.numero} ${ocorrencia.titulo || 'Sem título'}`;
        document.getElementById('viewDescricao').textContent = ocorrencia.descricao || 'Sem descrição';
        document.getElementById('viewLocalizacao').textContent = ocorrencia.localizacao || 'Não informado';
        document.getElementById('viewDenunciante').textContent = ocorrencia.denunciante;
        document.getElementById('viewEmpresa').textContent = ocorrencia.empresas?.nome || 'N/A';
        document.getElementById('viewSetor').textContent = ocorrencia.setores?.nome || 'N/A';
        document.getElementById('viewCategoria').textContent = ocorrencia.categorias?.nome || 'N/A';
        document.getElementById('viewUsuario').textContent = ocorrencia.users?.nome || 'N/A';
        document.getElementById('viewDataCriacao').textContent = formatDate(ocorrencia.created_at);

        const statusBadge = document.getElementById('viewStatus');
        statusBadge.textContent = ocorrencia.status;
        statusBadge.style.background = getStatusColor(ocorrencia.status) + '22';
        statusBadge.style.color = getStatusColor(ocorrencia.status);

        const prioridadeBadge = document.getElementById('viewPrioridade');
        prioridadeBadge.textContent = ocorrencia.prioridade;
        prioridadeBadge.style.background = getPriorityColor(ocorrencia.prioridade) + '22';
        prioridadeBadge.style.color = getPriorityColor(ocorrencia.prioridade);

        // Arquivos
        const arquivosContainer = document.getElementById('viewArquivos');
        if (ocorrencia.arquivos && ocorrencia.arquivos.length > 0) {
            arquivosContainer.innerHTML = ocorrencia.arquivos.map(arquivo => `
            <a href="${arquivo.url}" target="_blank" class="btn btn-outline btn-sm">
                📎 ${arquivo.nome}
            </a>
            `).join('');
        } else {
            arquivosContainer.textContent = 'Nenhum anexo';
        }

        document.getElementById('modoVisualizacao').style.display = 'block';
        document.getElementById('modoEdicao').style.display = 'none';
    }

    // Habilitar edição
    async function habilitarEdicao() {
      await loadSelectOptions('editEmpresa', 'empresas');
      await loadSelectOptions('editSetor', 'setores');
      await loadSelectOptions('editCategoria', 'categorias');

      document.getElementById('editTitulo').value = ocorrencia.titulo || '';
      document.getElementById('editDescricao').value = ocorrencia.descricao || '';
      document.getElementById('editLocalizacao').value = ocorrencia.localizacao;
      document.getElementById('editStatus').value = ocorrencia.status;
      document.getElementById('editPrioridade').value = ocorrencia.prioridade;
      document.getElementById('editDenunciante').value = ocorrencia.denunciante;
      document.getElementById('editEmpresa').value = ocorrencia.empresa_id;
      document.getElementById('editSetor').value = ocorrencia.setor_id;
      document.getElementById('editCategoria').value = ocorrencia.categoria_id;

      document.getElementById('modoVisualizacao').style.display = 'none';
      document.getElementById('modoEdicao').style.display = 'block';
    }

    // Cancelar edição
    function cancelarEdicao() {
      renderizarVisualizacao();
    }

    // Salvar edição
    document.getElementById('formEdicao').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btnText = document.getElementById('btnSalvarText');
      const btnLoading = document.getElementById('btnSalvarLoading');
      
      btnText.style.display = 'none';
      btnLoading.style.display = 'inline-block';

      try {
        const { error } = await supabase
          .from('occurrences')
          .update({
            titulo: document.getElementById('editTitulo').value || null,
            descricao: document.getElementById('editDescricao').value || null,
            localizacao: document.getElementById('editLocalizacao').value,
            status: document.getElementById('editStatus').value,
            prioridade: document.getElementById('editPrioridade').value,
            denunciante: document.getElementById('editDenunciante').value,
            empresa_id: document.getElementById('editEmpresa').value,
            setor_id: document.getElementById('editSetor').value,
            categoria_id: document.getElementById('editCategoria').value
          })
          .eq('id', ocorrenciaId);

        if (error) throw error;

        showNotification('Ocorrência atualizada com sucesso!', 'success');
        await carregarOcorrencia();

      } catch (error) {
        console.error('Erro ao atualizar ocorrência:', error);
        showNotification('Erro ao atualizar ocorrência', 'error');
        btnText.style.display = 'inline';
        btnLoading.style.display = 'none';
      }
    });

    // Excluir ocorrência
    async function excluirOcorrencia() {
      if (!confirm('Tem certeza que deseja excluir esta ocorrência? Esta ação não pode ser desfeita.')) {
        return;
      }

      try {
        const { error } = await supabase
          .from('occurrences')
          .delete()
          .eq('id', ocorrenciaId);

        if (error) throw error;

        showNotification('Ocorrência excluída com sucesso!', 'success');
        setTimeout(() => {
          window.location.href = 'ocorrencias.html';
        }, 1500);

      } catch (error) {
        console.error('Erro ao excluir ocorrência:', error);
        showNotification('Erro ao excluir ocorrência', 'error');
      }
    }
  </script>
</body>
</html>
