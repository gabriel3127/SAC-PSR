<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema de Ocorrências</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>Sistema de Ocorrências</h1>
        <p style="color: #64748b;">Faça login para continuar</p>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="seu@email.com"
            required
          >
        </div>
        
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="••••••••"
            required
          >
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          <span id="loginText">Entrar</span>
          <span id="loginLoading" class="loading" style="display: none;"></span>
        </button>
      </form>
      
      <div id="errorMessage" style="margin-top: 15px; padding: 12px; background: #fee2e2; color: #991b1b; border-radius: 8px; display: none;"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    // Verificar se já está logado
    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = 'dashboard.html';
      }
    });
    
    // Form de login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMessage');
      const loginText = document.getElementById('loginText');
      const loginLoading = document.getElementById('loginLoading');
      
      // Mostrar loading
      loginText.style.display = 'none';
      loginLoading.style.display = 'inline-block';
      errorMsg.style.display = 'none';
      
      try {
        await login(email, password);
        window.location.href = 'dashboard.html';
      } catch (error) {
        console.error('Erro no login:', error);
        errorMsg.textContent = 'Email ou senha incorretos. Tente novamente.';
        errorMsg.style.display = 'block';
        loginText.style.display = 'inline';
        loginLoading.style.display = 'none';
      }
    });
  </script>
</body>
</html>
